<header class="site-header">
  <nav class="site-nav wrap" aria-label="主导航">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="YangSpec 首页"><img class="brand-avatar" src="{{ "avatar-128.png" | relURL }}" alt="" width="30" height="30" decoding="async"><span>YangSpec<span class="brand-dot">.</span></span></a>
    <ul class="site-menu">
      {{- range site.Menus.main }}
      {{- $target := .URL | relURL }}
      <li><a href="{{ $target }}" {{ if eq $.RelPermalink $target }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
    <button class="theme-button" id="theme-toggle" type="button" aria-label="切换深浅色主题"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
  </nav>
</header>

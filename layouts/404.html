{{ define "main" }}
<div class="wrap">
  <section class="page error-page" aria-labelledby="not-found-title">
    {{ partial "page-header.html" (dict
      "eyebrow" "404 · 页面不存在"
      "title" "这一页没有了"
      "id" "not-found-title"
      "lede" "地址可能打错，或者这个页面已经被去掉。") }}
    <div class="hero-links">
      <a class="arrow-link" href="{{ "/" | relURL }}">回首页<span aria-hidden="true">→</span></a>
      <a class="arrow-link" href="mailto:{{ site.Params.email }}">写封邮件<span aria-hidden="true">↗</span></a>
    </div>
  </section>
</div>
{{ end }}

<!DOCTYPE html>
<html lang="{{ .Language.Locale | default "en" }}" data-theme="{{ site.Params.defaultTheme | default "auto" }}">
<head>{{ partial "head.html" . }}</head>
<body class="{{ if .IsHome }}home-page{{ else if .Params.planner }}planner-page{{ else if .IsPage }}article-page{{ else }}index-page{{ end }}" id="top">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{ partial "header.html" . }}
  <main class="main" id="main-content" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>

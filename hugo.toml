baseURL = "https://yangspec.com/"
locale = "zh-CN"
title = "YangSpec"
theme = "PaperMod"
enableRobotsTXT = true
summaryLength = 30

[params]
  defaultTheme = "light"
  description = "YangSpec 的个人网站：近况、写下的东西，以及联系方式。"
  author = "YangSpec"
  city = "成都"
  email = "yua81093@gmail.com"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = false
  DateFormat = "2006 年 1 月 2 日"
  mainSections = ["posts"]

[params.assets]
  # ?v= 用来打破浏览器与 CDN 的图标缓存：换图标后把这个数字加一。
  favicon = "favicon.ico?v=2"
  favicon16x16 = "favicon-16x16.png?v=2"
  favicon32x32 = "favicon-32x32.png?v=2"
  apple_touch_icon = "apple-touch-icon.png?v=2"
  theme_color = "#213c35"
  msapplication_TileColor = "#213c35"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

# 个人站没有分类与标签页，关掉默认的 taxonomies。
[taxonomies]

# 导航在这里维护：加一项就多一个入口。
[menu]
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 1
  [[menu.main]]
    name = "联系"
    url = "/contact/"
    weight = 2

[outputs]
  home = ["HTML", "RSS"]

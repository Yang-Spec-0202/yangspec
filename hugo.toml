baseURL = "https://yangspec.com/"
locale = "en-US"
title = "YangSpec"
theme = "PaperMod"
enableRobotsTXT = true
paginate = 10
summaryLength = 30

[params]
  defaultTheme = "light"
  description = "Plan a self-hosted stack with transparent capacity estimates, separate backups and a complete monthly cost worksheet."
  author = "YangSpec"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  DateFormat = "January 2, 2006"
  mainSections = ["posts"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    name = "Planner"
    url = "/tools/selfhost-planner/"
    weight = 1
  [[menu.main]]
    name = "Guides"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "Privacy"
    url = "/privacy/"
    weight = 4

[outputs]
  home = ["HTML", "RSS"]

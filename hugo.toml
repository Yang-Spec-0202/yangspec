baseURL = "https://yangspec.com/"
locale = "en-US"
title = "YangSpec"
theme = "PaperMod"
enableRobotsTXT = true
paginate = 10
summaryLength = 30

[params]
  defaultTheme = "light"
  description = "Free browser tools with clear limits. Prepare a JPG or PNG attachment, or plan a self-hosted stack. No account required."
  author = "YangSpec"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  DateFormat = "January 2, 2006"
  mainSections = ["posts"]

[params.assets]
  favicon = "favicon.svg"
  theme_color = "#213c35"
  msapplication_TileColor = "#213c35"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    name = "Tools"
    url = "/tools/"
    weight = 1
  [[menu.main]]
    name = "Guides"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "Privacy"
    url = "/privacy/"
    weight = 4

[outputs]
  home = ["HTML", "RSS"]

baseURL = "https://yangspec.com/"
locale = "zh-CN"
title = "YangSpec"
theme = "PaperMod"
enableRobotsTXT = true
summaryLength = 30

[params]
  defaultTheme = "light"
  description = "YangSpec 的个人网站：近况、写下的东西，以及联系方式。"
  author = "YangSpec"
  city = "成都"
  email = "yua81093@gmail.com"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = false
  DateFormat = "2006 年 1 月 2 日"
  mainSections = ["posts"]

# 联盟 / 推荐链接：当前指向官网，站长加入计划后换成带推荐码的 URL。
# 占位名：AFFILIATE_VULTR / AFFILIATE_BANDWAGON / AFFILIATE_RACKNERD /
#         AFFILIATE_666CLOUDS / AFFILIATE_NAMECHEAP
[params.affiliates]
  vultr = "https://www.vultr.com/"
  bandwagon = "https://bandwagonhost.com/"
  racknerd = "https://www.racknerd.com/"
  liuliuyun = "https://www.666clouds.com/"
  namecheap = "https://www.namecheap.com/"

# 打赏平台主页：留空则支持页只显示文字提示，不生成假链接。
# 占位名：SUPPORT_AFDIAN / SUPPORT_BUYMEACOFFEE
[params.support]
  afdian = ""
  buymeacoffee = ""

[params.assets]
  # ?v= 用来打破浏览器与 CDN 的图标缓存：换图标后把这个数字加一。
  favicon = "favicon.ico?v=2"
  favicon16x16 = "favicon-16x16.png?v=2"
  favicon32x32 = "favicon-32x32.png?v=2"
  apple_touch_icon = "apple-touch-icon.png?v=2"
  theme_color = "#213c35"
  msapplication_TileColor = "#213c35"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

# 个人站没有分类与标签页，关掉默认的 taxonomies。
[taxonomies]

# 导航在这里维护：加一项就多一个入口。
[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "服务"
    url = "/services/"
    weight = 3
  [[menu.main]]
    name = "支持"
    url = "/support/"
    weight = 4
  [[menu.main]]
    name = "联系"
    url = "/contact/"
    weight = 5

[outputs]
  home = ["HTML", "RSS"]

# 列表每页篇数：文章多了也不至于一页拉到底。
# 改动这里会改变 /posts/ 的分页页数与 /posts/page/N/ 路径。
[pagination]
  pagerSize = 8
